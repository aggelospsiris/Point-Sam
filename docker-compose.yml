services:
  sam-pointing-demo:
    build:
      context: .
      args:
        HF_TOKEN: ${HF_TOKEN:-}
        SAM3_MODEL_ID: facebook/sam3
        SAM3_LOCAL_DIR: /opt/models/facebook-sam3
    image: realsense-sam-pointing-demo:latest
    container_name: realsense-sam-pointing-demo
    privileged: true
    runtime: nvidia
    ports:
      - "${HOST_BIND:-127.0.0.1}:8001:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      SAM_BACKEND: sam3
      SAM_BACKENDS: sam3
      SAM_DEVICE: cuda
      SAM_DTYPE: float16
      SAM_AUTOCAST: "1"
      SAM3_MODEL_ID: /opt/models/facebook-sam3
      SAM_CHECKPOINT: /workspace/models/sam/sam_vit_h_4b8939.pth
      SAM_MODEL_TYPE: vit_h
      SAM_MODEL_ID: /opt/models/facebook-sam3
      SAM2_CONFIG: ""
      SAM3_FACTORY: ""
      SAM_MULTIMASK: "1"
      SAM_INTERVAL_S: "0.75"
      SAM_ON_PROJECTED_PROMPT: "1"
      SAM_PROMPT_CONTAINS_BONUS: "0.25"
      SAM_PROMPT_MISS_PENALTY: "0.75"
      SAM_MASK_MIN_AREA_RATIO: "0.0004"
      SAM_MASK_MAX_AREA_RATIO: "0.65"
      SAM_MASK_DETAIL_AREA_RATIO: "0.012"
      SAM_MASK_DETAIL_PENALTY: "0.65"
      SAM_PREFER_ENCLOSING_MASK: "1"
      SAM_ENCLOSING_MIN_AREA_RATIO: "0.012"
      SAM_ENCLOSING_MAX_AREA_RATIO: "0.55"
      SAM_ENCLOSING_SCORE_MARGIN: "0.45"
      SAM_ENCLOSING_AREA_WEIGHT: "0.50"
      SAM_RESET_PROMPT_JUMP_PX: "90"
      POINT_RAY_MARCH_SAMPLES: "48"
      POINT_RAY_MARCH_PATCH_RADIUS: "4"
      POINT_RAY_MARCH_DEPTH_PERCENTILE: "25"
      POINT_RAY_MARCH_DEPTH_CLUSTER_M: "0.04"
      POINT_ALIGNMENT_TIEBREAK_M: "0.01"
      POINT_NEAR_FIELD_M: "0.75"
      POINT_NEAR_SAMPLE_FRACTION: "0.65"
      POINT_HIT_SUPPORT_RADIUS_PX: "3"
      POINT_HIT_MIN_DEPTH_SUPPORT: "4"
      POINT_HIT_SUPPORT_DEPTH_TOLERANCE_M: "0.05"
      POINT_CLOSER_SWITCH_MARGIN_M: "0.03"
      POINT_FRONT_SURFACE_WINDOW_M: "0.03"
      POINT_HIT_STABLE_RADIUS_PX: "18"
      POINT_HIT_STABLE_DEPTH_M: "0.04"
      POINT_HIT_PENDING_RADIUS_PX: "28"
      POINT_HIT_PENDING_DEPTH_M: "0.08"
      POINT_HIT_SWITCH_CONFIRM_FRAMES: "10"
      POINT_HIT_MAX_HOLD_FRAMES: "10"
      POINT_CLOUD_HIT_FALLBACK: "0"
      POINT_HIT_STRIDE: "4"
      POINT_HIT_MAX_OFFSET_M: "0.08"
      POINT_HIT_MIN_OFFSET_M: "0.040"
      POINT_HIT_CONE_DEG: "3.0"
      POINT_HIT_CORE_FRACTION: "0.45"
      POINT_HIT_OFFSET_WEIGHT: "4.0"
      POINT_HIT_FORWARD_WEIGHT: "0.08"
      POINT_MIN_FORWARD_M: "0.025"
      POINT_MAX_FORWARD_M: "4.0"
      POINT_ALLOW_FALLBACK: "1"
      POINT_SHOW_PROJECTED_WHEN_NO_DEPTH: "1"
      POINT_FALLBACK_DISTANCE_M: "2.0"
      POINT_PIXEL_SMOOTHING: "0.20"
      POINT_PIXEL_DEADBAND_PX: "12"
      POINT_PIXEL_MAX_JUMP_PX: "160"
      POINT_PROMPT_REFINE_RADIUS_PX: "10"
      POINT_PROMPT_DEPTH_TOLERANCE_M: "0.07"
      DEPTH_MIN_M: "0.15"
      DEPTH_MAX_M: "4.0"
      HAND_BACKEND: mediapipe
      HAND_MODEL_PATH: models/sveldman_hand_model.pt
      HAND_DEVICE: "0"
      HAND_IMGSZ: "640"
      HAND_CONFIDENCE: "0.10"
      HAND_KEYPOINT_VISIBILITY: "0.05"
      HAND_KEYPOINT_CONFIDENCE: "0.08"
      HAND_TRACKING_CONFIDENCE: "0.08"
      MAX_HANDS: "1"
      HAND_PROCESS_WIDTH: "640"
      HAND_MODEL_COMPLEXITY: "1"
      POINTING_START_LANDMARK: "5"
      POINTING_END_LANDMARK: "8"
      POINTING_FINGER_LANDMARKS: "5,6,7,8"
      HAND_DEPTH_PATCH_RADIUS: "5"
      HAND_DEPTH_PERCENTILE: "25"
      HAND_DEPTH_CLUSTER_M: "0.08"
      MIN_HAND_RAY_LENGTH_M: "0.025"
      POINTING_RAY_ORIGIN_ADVANCE_M: "0.015"
      POINTING_MAX_JUMP_PX: "220"
      POINTING_MAX_ANGLE_JUMP_DEG: "35"
      POINTING_SMOOTHING: "0.25"
      POINTING_MOVING_SMOOTHING: "0.65"
      POINTING_SEGMENT_DIRECTION_WEIGHT: "0.0"
      POINTING_ANGLE_DEADBAND_DEG: "2.0"
      POINTING_ENDPOINT_DEADBAND_PX: "8"
      FRAME_WIDTH: "1280"
      FRAME_HEIGHT: "720"
      FRAME_FPS: "30"
      JPEG_QUALITY: "85"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      LD_LIBRARY_PATH: "/usr/local/lib/python3.10/site-packages/nvidia/cudnn/lib:/usr/local/lib/python3.10/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.10/site-packages/nvidia/cuda_runtime/lib:/usr/local/lib/python3.10/site-packages/nvidia/cuda_nvrtc/lib:/usr/local/lib/python3.10/site-packages/nvidia/cufft/lib:/usr/local/lib/python3.10/site-packages/nvidia/curand/lib:/usr/local/lib/python3.10/site-packages/nvidia/cusolver/lib:/usr/local/lib/python3.10/site-packages/nvidia/cusparse/lib:/usr/local/lib/python3.10/site-packages/nvidia/nccl/lib:/usr/local/lib/python3.10/site-packages/nvidia/nvtx/lib"
    volumes:
      - .:/workspace
      - ./models:/workspace/models
      - ./models/huggingface:/root/.cache/huggingface
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command: python -m sam_pointing_demo ${APP_FLAGS:-}
